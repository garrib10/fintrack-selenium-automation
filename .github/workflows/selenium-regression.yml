name: Selenium Regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selenium-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Selenium regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FINTRACK_BASE_URL: ${{ vars.FINTRACK_BASE_URL }}
      FINTRACK_TEST_EMAIL: ${{ secrets.FINTRACK_TEST_EMAIL }}
      FINTRACK_TEST_PASSWORD: ${{ secrets.FINTRACK_TEST_PASSWORD }}
      FINTRACK_ALLOW_REGISTRATION: ${{ vars.FINTRACK_ALLOW_REGISTRATION }}
      FINTRACK_TEST_BUDGET_CATEGORY: ${{ vars.FINTRACK_TEST_BUDGET_CATEGORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Display tool versions
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Validate test configuration
        shell: bash
        run: |
          if [[ -z "$FINTRACK_BASE_URL" ]]; then
            echo "FINTRACK_BASE_URL is not configured"
            exit 1
          fi

          if [[ -z "$FINTRACK_TEST_EMAIL" ]]; then
            echo "FINTRACK_TEST_EMAIL is not configured"
            exit 1
          fi

          if [[ -z "$FINTRACK_TEST_PASSWORD" ]]; then
            echo "FINTRACK_TEST_PASSWORD is not configured"
            exit 1
          fi

          if [[ -z "$FINTRACK_TEST_BUDGET_CATEGORY" ]]; then
            echo "FINTRACK_TEST_BUDGET_CATEGORY is not configured"
            exit 1
          fi

      - name: Run headless Selenium regression suite
        run: >
          mvn
          --batch-mode
          --no-transfer-progress
          clean
          test
          -Dheadless=true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-failure-evidence-${{ github.run_id }}
          path: target/test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
